      <script>
        let slideIndex = [1,1,1,1,1,1,1,1,1]; // one per slideshow

        // Initialize all slideshows
        showSlides(1, 0, "Seattle Slides");
        showSlides(1, 1, "Juneau Slides");
        showSlides(1, 2, "Skagway Slides");
        showSlides(1, 3, "Haines Slides");
        showSlides(1, 4, "Hubbard Slides");
        showSlides(1, 5, "IcyStrait Slides");
        showSlides(1, 6, "Sitka Slides");
        showSlides(1, 7, "Ketchikan Slides");
        showSlides(1, 8, "Victoria Slides");

        function plusSlides(n, no, className) {
          showSlides(slideIndex[no] += n, no, className);
        }

        function currentSlide(n, no, className) {
          showSlides(slideIndex[no] = n, no, className);
        }

        function showSlides(n, no, className) {
          let i;
          let slides = document.getElementsByClassName(className);

          if (n > slides.length) slideIndex[no] = 1;
          if (n < 1) slideIndex[no] = slides.length;

          for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
          }

          let currentIndex = slideIndex[no];
          slides[currentIndex - 1].style.display = "block";

          // ✅ UPDATE COUNTER HERE
          let counter = document.getElementById("counter-" + no);
          if (counter) {
            counter.textContent = currentIndex + " / " + slides.length;
          }
        }
    </script>
